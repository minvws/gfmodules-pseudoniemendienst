name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run build action
        uses: minvws/action-python-poetry-install@2a1cbf8c2270c5fec60acdbfebae3c072c27f1cb # v1.0.2
        with:
          python_version: "3.14"

  lint:
    name: Run code linter
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run build action
        uses: minvws/action-python-poetry-install@2a1cbf8c2270c5fec60acdbfebae3c072c27f1cb # v1.0.2
        with:
          python_version: "3.14"

      - name: Lint (ruff check)
        run: poetry run ruff check

      - name: Lint (ruff format)
        run: poetry run ruff format --diff

  type-check:
    name: Check static types
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run build action
        uses: minvws/action-python-poetry-install@2a1cbf8c2270c5fec60acdbfebae3c072c27f1cb # v1.0.2
        with:
          python_version: "3.14"

      - name: Check static types (mypy)
        run: poetry run mypy app tests

  safety-check:
    name: Scan packages for vulnerabilities
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run build action
        uses: minvws/action-python-poetry-install@2a1cbf8c2270c5fec60acdbfebae3c072c27f1cb # v1.0.2
        with:
          python_version: "3.14"

      - name: Scan packages for vulnerabilities (pip-audit)

        run: poetry run pip-audit

  spelling-check:
    name: Run spelling check
    runs-on: ubuntu-24.04
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run build action
        uses: minvws/action-python-poetry-install@2a1cbf8c2270c5fec60acdbfebae3c072c27f1cb # v1.0.2
        with:
          python_version: "3.14"

      - uses: codespell-project/codespell-problem-matcher@9ba2c57125d4908eade4308f32c4ff814c184633 # v1.2.0

      - name: Run spelling check (codespell)
        run: poetry run codespell .

  test:
    name: Run the tests
    runs-on: ubuntu-24.04
    needs: build
    services:
      prs_db:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run build action
        uses: minvws/action-python-poetry-install@2a1cbf8c2270c5fec60acdbfebae3c072c27f1cb # v1.0.2
        with:
          python_version: "3.14"

      - name: install dependencies
        run: |
          sudo apt update
          sudo apt install -y libpq-dev build-essential postgresql-client

      - name: install liboprf
        env:
          # Commit of tag v0.9.4; keep in sync with LIBOPRF_COMMIT in docker/Dockerfile
          LIBOPRF_COMMIT: ba45204806daeb5b1b249d7b35ca0035cba3d641
        run: |
          sudo apt install -y libsodium-dev
          git init -q liboprf
          cd liboprf
          git fetch --depth 1 https://github.com/stef/liboprf.git "$LIBOPRF_COMMIT"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$LIBOPRF_COMMIT"
          cd src
          make
          sudo make install
          sudo ldconfig

      - name: Run the tests
        run: |
          sudo bash -c 'echo "127.0.0.1 prs_db" >> /etc/hosts'
          DSN="postgresql://postgres:postgres@prs_db:5432/postgres" poetry run ./tools/migrate_db.sh
          poetry run pytest --cov --cov-report=term --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml

  sonar:
    name: SonarCloud
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Download coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - name: Run SonarQube scan
        uses: minvws/action-sonarqube@28bd902ee133b7c212e5f3e82eb58886fe447719 # v1.1.7
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  detect_modified_files:
    name: Modified files
    runs-on: ubuntu-24.04
    outputs:
      image_files_changed: ${{ steps.image-files-changed.outputs.any_changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check image-related file changes
        id: image-files-changed
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            docker/Dockerfile
            pyproject.toml
            poetry.lock
            .github/workflows/ci.yaml

  image_build_scan_push:
    name: Build, scan, and push Docker image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    needs:
      [
        build,
        lint,
        type-check,
        safety-check,
        spelling-check,
        test,
        detect_modified_files,
      ]
    # Only run this job on main branch, version tags, or if image-related files have changed
    if: |
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      needs.detect_modified_files.outputs.image_files_changed == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to the Container registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          NEW_UID: 1000
          NEW_GID: 1000
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEW_UID=${{ env.NEW_UID }}
            NEW_GID=${{ env.NEW_GID }}
            standalone=true
            RELEASE_VERSION=${{ github.ref_name }}
            GIT_SHA=${{ github.sha }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: "sarif"
          output: "trivy-results.sarif"
          exit-code: "0"
          severity: "CRITICAL,HIGH"
          vuln-type: "library"
          ignore-policy: .trivyignore.rego

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        # Only upload SARIF results on main branch or version tags
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          sarif_file: "trivy-results.sarif"

      - name: Fail build on vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
          format: "table"
          exit-code: ${{ (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && '0' || '1' }}
          severity: "CRITICAL,HIGH"
          vuln-type: "library"
          ignore-policy: .trivyignore.rego
          skip-setup-trivy: true

      - name: Push Docker image
        id: push
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          image=""
          digest=""

          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            current_image="${tag%:*}"
            if [[ "$current_image" == "$tag" || ( -n "$image" && "$current_image" != "$image" ) ]]; then
              echo "::error::Image tags must refer to the same named image"
              exit 1
            fi

            push_output="$(docker push "$tag")"
            printf '%s\n' "$push_output"
            current_digest="$(printf '%s\n' "$push_output" | sed -nE 's/^.*: digest: (sha256:[0-9a-f]{64}) size: [0-9]+$/\1/p')"
            if [[ ! "$current_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Could not determine the pushed image digest"
              exit 1
            fi
            if [[ -n "$digest" && "$current_digest" != "$digest" ]]; then
              echo "::error::Image tags were pushed with different digests"
              exit 1
            fi
            image="$current_image"
            digest="$current_digest"
          done <<< "$IMAGE_TAGS"

          if [[ -z "$image" || -z "$digest" ]]; then
            echo "::error::No Docker image tags were provided"
            exit 1
          fi
          printf 'image=%s\ndigest=%s\n' "$image" "$digest" >> "$GITHUB_OUTPUT"

      - name: Attest Docker image
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.push.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
