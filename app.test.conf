# Configuration settings for regular tests (locally, not CI)
[app]
loglevel=debug
enable_test_routes=True
enable_exchange_services_routes=True
enable_saml_exchange_routes=True

[database]
dsn=postgresql+psycopg://postgres:postgres@localhost/testing
retry_backoff=0.1, 0.2, 0.4, 0.8, 1.6, 3.2, 4.8, 6.4, 10.0
pool_size=5
max_overflow=10
pool_pre_ping=False
pool_recycle=1800

[uvicorn]
swagger_enabled = False
docs_url = /docs
redoc_url = /redoc
host = 0.0.0.0
port = 8503
reload = True
use_ssl = False
ssl_base_dir =
ssl_cert_file =
ssl_key_file =

[local_keys]
master_key=
; file with base64 server key for oprf evaluation (create with oprf_service.generate_key)
oprf_server_key_file = secrets/test-oprf.key

[saml_service]
# Tests override the client via dependency_overrides; this port is intentionally
# unused so the unmocked path fails fast (exercised by the 502 test).
url=http://127.0.0.1:8599
timeout=1

[authorization_headers]
expected_audiences = prs.service

[jwks]
# path for local signing and decryption certificates
signing_cert_path =
decryption_cert_path =
signing_key_files =
active_signing_key_files =
encryption_key_files =
active_encryption_key_files =
hsm_key_labels =
active_hsm_key_labels =
